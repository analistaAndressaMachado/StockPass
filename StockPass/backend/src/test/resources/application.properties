spring.application.name=stockpass-test
server.port=0
spring.datasource.url=jdbc:sqlite:target/stockpass-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=TEST-ONLY-NOT-A-REAL-SECRET-StockPass-Integration-Tests-2026-Long-Random-Value
app.jwt.expiration-ms=86400000
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.password-reset.from=test-only@localhost
app.password-reset.frontend-url=http://localhost:5173
app.password-reset.ttl-minutes=30
app.uploads.dir=${java.io.tmpdir}/stockpass-test-uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
