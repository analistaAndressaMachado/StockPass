spring.application.name=stockpass
server.port=8080
spring.datasource.url=jdbc:sqlite:stockpass.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=StockPassAcademicSecretKeyChangeMe2026StockPass
app.jwt.expiration-ms=86400000
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.password-reset.from=${MAIL_FROM:stockpass@localhost}
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.ttl-minutes=30
